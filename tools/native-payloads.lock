# Where each desktop native payload is built FROM, pinned by digest.
#
# This file is the upstream side of the contract. The downstream side — the
# digest of the archive NoMercy publishes and the JVM target downloads — lives
# in NativeArchives.kt, because that is what the running library verifies.
#
# Two digests per platform, deliberately. This one says "the bytes we built it
# out of are the bytes VideoLAN published"; the one in Kotlin says "the bytes
# this machine is about to load are the bytes we built". A single digest cannot
# say both, and the interesting supply-chain failures live in the gap.
#
#   tools/build-native-payload.sh libvlc windows-x64

# libmpv, the desktop engine. It replaced libVLC, whose entries were removed
# with the engine itself.
#
# The upstream redistributable, unmodified: shinchiro's mpv-winbuild-cmake
# publishes a dev package carrying libmpv-2.dll and the headers, which is what
# every Windows consumer of libmpv builds against.
#
# LICENCE, stated plainly rather than discovered later. That build is GPL, the
# same footing the libVLC payload beside it is on today — VideoLAN's own
# redistributable is GPL through its plugin set. tools/vlc-lgpl.dockerfile
# exists to replace one of them from source with --disable-gpl and libmpv needs
# the same treatment before either is published in a library that others link
# against. Until then this is a development payload and the LGPL build is the
# open item, for both engines rather than for this one.

# Two versions, because the two platforms take libmpv from two places: the
# Windows payload is upstream's dev package and the Linux one is Debian's
# libmpv2. A single number would name one of them wrongly.
libmpv.version=2026.10.07
libmpv.linux-x64.version=0.35.1
libmpv.android-arm64.version=0.41.0
libmpv.android-arm.version=0.41.0

libmpv.windows-x64.kind=7z
# Upstream prunes old releases. The 20260610 build returned 404 and broke every
# fresh Windows build, so this pin must be refreshed whenever the URL 404s: pick
# a current mpv-dev-x86_64 asset (plain x86_64, not -v3), recompute the sha256
# of the downloaded file, and bump libmpv.version and natives/payloads.json to
# the same date. This is a stopgap; the real fix is an LGPL libmpv built by us
# (issue #60).
libmpv.windows-x64.source=https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261007/mpv-dev-x86_64-20261007-git-eb0ee10315.7z
libmpv.windows-x64.sha256=3fd93055d437310ad094d3f80c9b04f9a56e8b138bcb7d9c5cf01870abbfe5a5

# Linux has no portable libmpv build either, and for the same reason libVLC has
# none: the project ships source and the distributions ship packages. So it is
# assembled in a container from Debian's own package plus every non-glibc shared
# object it pulls in, and the container is the pin.
libmpv.linux-x64.kind=container
libmpv.linux-x64.source=debian:bookworm-slim
libmpv.linux-x64.sha256=

# macOS has no prebuilt libmpv anybody publishes: mpv ships source, the app
# bundles that exist are years stale, and there is no equivalent of VideoLAN's
# .dmg. So it is Homebrew's build on the Mac itself, closed over and re-pointed
# at itself with install_name_tool — the container is not an option, because the
# tools that read and rewrite a Mach-O dependency list only run on macOS.
# Android takes libmpv from mpv-android's own buildscripts, in a container, and
# the recipe is the pin. There is no package to take it from: Android's only
# AVC decoders top out at High profile, so a stock device cannot decode Hi10P at
# all, and every 10-bit anime file in a library needs a decoder we bring
# ourselves. ffmpeg inside libmpv is that decoder.
libmpv.android-arm64.kind=android-container
libmpv.android-arm64.source=tools/libmpv-android.dockerfile
libmpv.android-arm64.sha256=

libmpv.android-arm.kind=android-container
libmpv.android-arm.source=tools/libmpv-android.dockerfile
libmpv.android-arm.sha256=

# Its own version, because the fallback is the Windows one.
#
# Without this line the script fell back to libmpv.version and packed
# libmpv-2026.10.07-macos-arm64.tar.gz while the catalog -- which is what the
# loader fetches and what the bundling task copies -- names 0.41.0. The build
# succeeded, the file was written, and the caller found nothing at the name it
# asked for. PayloadVersionsAgreeTest is the check that was missing.
libmpv.macos-arm64.version=0.41.0
libmpv.macos-arm64.kind=brew
libmpv.macos-arm64.source=homebrew/core/mpv
libmpv.macos-arm64.sha256=
