name: ci

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Core's payloads come from release assets, and one of them -- libass -- lives
# in a private repository, so `gh release download` is an authenticated call.
# Only publish.yml ever set GH_TOKEN, so the moment these jobs left GitHub's own
# runners they failed with gh's own advice: "set the GH_TOKEN environment
# variable".
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GH_TOKEN: ${{ github.token }}

jobs:
  # Everything that does not need Apple hardware. `build` runs jvmTest, the
  # Android host tests, detekt, and both API checks — JVM and klib. The klib
  # check covers the iOS and tvOS public surface, because Kotlin/Native compiles
  # klibs on any host; only linking a framework needs macOS.
  jvm-android:
    runs-on: [self-hosted, Linux, X64, beast-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # First, and on its own, because drift from the ecosystem contract is
      # the one failure whose cause is not in this repo's diff. Named, so a red
      # run says which question was answered no.
      - name: Conformance gate
        run: ./gradlew parityConformance

      - run: ./gradlew build

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jvm-android
          path: |
            build/reports/
            build/test-results/
          retention-days: 7

  # The two libraries that consume this one, compiled against this commit.
  #
  # Core is the only repo in the trio that can break the other two, and it was
  # the only one with nothing watching. Video and music each compile against a
  # core checkout in their own CI, so a core push that removes or renames
  # something was caught whenever a consumer next pushed -- which is to say,
  # not by the push that caused it.
  #
  # That is not hypothetical. The app's Android release build failed on
  # 2026-08-08 compiling video-player against a core master that did not yet
  # carry KeyHandlerScope, DEFAULT_COOLDOWN_MS, NO_ACTIVE_ITEM or
  # PluginOptionField. Video's master was hours ahead of core's, every repo was
  # individually green, and the break surfaced days later in a third repo's
  # release.
  #
  # The consumers are taken at master because that is the ref the app's release
  # workflow clones. Green here means the app can resolve this core.
  downstream:
    runs-on: [self-hosted, Linux, X64, beast-unit]
    steps:
      # The monorepo layout, because that is what both consumers'
      # settings.gradle.kts looks for: each substitutes the coordinate with a
      # sibling checkout at ../nomercy-player-core-kmp when one is there.
      - uses: actions/checkout@v4
        with:
          path: packages-native/nomercy-player-core-kmp

      - uses: actions/checkout@v4
        with:
          repository: NoMercy-Entertainment/nomercy-video-player-kmp
          path: packages-native/nomercy-video-player-kmp

      - uses: actions/checkout@v4
        with:
          repository: NoMercy-Entertainment/nomercy-music-player-kmp
          path: packages-native/nomercy-music-player-kmp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # assemble, not build: this job answers "can a consumer still compile
      # against this core", and their own suites are their own CI's job. Every
      # target the runner can build, because androidMain code that reaches for a
      # symbol commonMain never touched is exactly what the app trips over.
      - name: Video player compiles against this core
        working-directory: packages-native/nomercy-video-player-kmp
        run: ./gradlew assemble --console=plain

      - name: Music player compiles against this core
        working-directory: packages-native/nomercy-music-player-kmp
        run: ./gradlew assemble --console=plain

  # The half that legally requires Apple hardware: executing Kotlin/Native tests
  # on a simulator, and linking the xcframework the Swift side consumes. SKIE
  # only runs during framework linking, so this job is the first place its output
  # is exercised at all.
  apple:
    runs-on: [self-hosted, macOS, ARM64, xcode]
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Every module with Apple targets, not just the engine. The testing kit
      # and the plugin template both compile for iOS and tvOS, and a suite that
      # only ran the root project's would leave the two modules a consumer
      # actually copies checked by nothing on the platform with the least
      # tooling.
      - name: Run Apple unit tests
        run: >-
          ./gradlew iosSimulatorArm64Test tvosSimulatorArm64Test
          :testing:iosSimulatorArm64Test :testing:tvosSimulatorArm64Test
          :templates:plugin:compileKotlinIosArm64 :templates:plugin:compileKotlinTvosArm64

      - name: Link the xcframework
        run: ./gradlew assembleNoMercyPlayerCoreXCFramework

      # Builds the debug product for both platforms, runs its simulator suites,
      # and type-checks the surface file against the framework that was just
      # linked.
      #
      # The surface file was written to answer "does this read like an API from
      # Swift" and then nothing ran it. The constructor gained seven arguments
      # over the campaign and every one of them was a compile error sitting in a
      # file no job opened. A check nobody runs is a check that is already wrong.
      - name: Swift surfaces build and their suites run
        run: ./check.sh

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-apple
          path: |
            build/reports/
            build/test-results/
          retention-days: 7
