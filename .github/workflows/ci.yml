name: ci

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # Everything that does not need Apple hardware. `build` runs jvmTest, the
  # Android host tests, detekt, and both API checks — JVM and klib. The klib
  # check covers the iOS and tvOS public surface, because Kotlin/Native compiles
  # klibs on any host; only linking a framework needs macOS.
  jvm-android:
    runs-on: [self-hosted, Linux, X64, beast-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # First, and on its own, because drift from the ecosystem contract is
      # the one failure whose cause is not in this repo's diff. Named, so a red
      # run says which question was answered no.
      - name: Conformance gate
        run: ./gradlew parityConformance

      - run: ./gradlew build

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jvm-android
          path: |
            build/reports/
            build/test-results/
          retention-days: 7

  # The half that legally requires Apple hardware: executing Kotlin/Native tests
  # on a simulator, and linking the xcframework the Swift side consumes. SKIE
  # only runs during framework linking, so this job is the first place its output
  # is exercised at all.
  apple:
    runs-on: [self-hosted, macOS, ARM64, xcode]
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Apple unit tests
        run: ./gradlew iosSimulatorArm64Test tvosSimulatorArm64Test

      - name: Link the xcframework
        run: ./gradlew assembleNoMercyPlayerCoreXCFramework

      # Builds the debug product for both platforms, runs its simulator suites,
      # and type-checks the surface file against the framework that was just
      # linked.
      #
      # The surface file was written to answer "does this read like an API from
      # Swift" and then nothing ran it. The constructor gained seven arguments
      # over the campaign and every one of them was a compile error sitting in a
      # file no job opened. A check nobody runs is a check that is already wrong.
      - name: Swift surfaces build and their suites run
        run: ./check.sh

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-apple
          path: |
            build/reports/
            build/test-results/
          retention-days: 7
