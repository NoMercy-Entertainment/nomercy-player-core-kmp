name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# The payload download needs a token, in EVERY job that builds.
#
# Core assembles its native payloads from release assets, and one of them --
# libass -- lives in a private repository, so `gh release download` is an
# authenticated call. Only the xcframework job below ever set this, so the
# publish job itself failed on a v0.1.0 tag with a bare 401 "Requires
# authentication" against libass-0.17.5-1-windows-x64.tar.gz, before it reached
# a single thing the release was about.
#
# The org PAT rather than the job's own token: GITHUB_TOKEN is scoped to THIS
# repository and cannot read another private one, which is exactly the call
# being made. Falls back so a fork without the secret still builds the payloads
# it can reach.
env:
  GH_TOKEN: ${{ secrets.PAT || github.token }}

jobs:
  # macOS only, and not by preference. A multiplatform publication has to carry
  # every declared target, and the Apple frameworks can only be linked here.
  # Publishing from Linux would silently ship an artifact with no Apple variants.
  publish:
    runs-on: [self-hosted, macOS, ARM64, xcode]
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Chrome, because `build` runs the Kotlin/Wasm browser tests through karma
      # and this Mac has no browser on the runner's PATH. Without it the task
      # discovers zero tests and Gradle fails the build with "test sources
      # present ... did not discover any tests to execute" — which reads as a
      # misconfigured suite rather than a machine with no browser.
      #
      # ci.yml already does this on Linux. Nothing did it here, because no CI
      # job ever ran a full `build` on macOS: the apple job runs the simulator
      # suites, and the wasm target only meets this runner during a release.
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      # Karma looks the browser up by this variable rather than by PATH.
      - name: Point karma at that Chrome
        run: echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      # The tag is the source of truth for what gets published. A tag that does
      # not match VERSION_NAME would publish a version nobody asked for, under a
      # name nobody can find.
      - name: Tag must match VERSION_NAME
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "$tagged" != "$declared" ]; then
            echo "tag v$tagged does not match VERSION_NAME=$declared" >&2
            exit 1
          fi

      # Gates first. A release that skips them is a release nothing checked.
      - run: ./gradlew build

      # Three artifacts leave this repository, and a release missing one of
      # them is only noticed by the consumer who resolves it. The engine, the
      # testing kit and the Compose surfaces are named here so a module that
      # stopped publishing shows up as a red release rather than as a
      # dependency somebody cannot find.
      - name: Every artifact is in the release
        run: |
          set -euo pipefail
          # Full task paths, because ':' + ':publishToMavenCentral' is
          # '::publishToMavenCentral' and Gradle does not have that task.
          # The first version of this guard would have reddened a correct
          # release on the engine and passed the two modules it was written
          # to watch.
          for task in ':publishToMavenCentral' ':testing:publishToMavenCentral' ':ui-compose:publishToMavenCentral'; do
            if ! ./gradlew "$task" --dry-run -q >/dev/null; then
              echo "$task does not exist: that artifact would not be published" >&2
              exit 1
            fi
          done

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  # The Apple half of the release. Separate from the Maven job because it
  # attaches an asset and rewrites a manifest, and neither should run if the
  # artifacts nobody can see yet failed to publish.
  xcframework:
    needs: publish
    runs-on: [self-hosted, macOS, ARM64, xcode]
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Package, attach and stamp
        run: ./tools/release-xcframework.sh NoMercyPlayerCore Package.swift
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: master
