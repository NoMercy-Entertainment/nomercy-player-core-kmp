[versions]
# Pinned to nomercy-app-kmp's catalog. The app consumes this library, and a
# Kotlin/AGP split between the two produces metadata the app cannot read.
# Changing either of these two lines requires changing the app in the same pass.
kotlin = "2.2.21"
agp = "9.0.1"
androidxStartup = "1.2.0"

coroutines = "1.10.2"
serialization = "1.9.0"
atomicfu = "0.29.0"
vlcj = "4.11.0"
media3 = "1.9.0"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"

detekt = "1.23.8"
binaryCompatibilityValidator = "0.18.1"
mavenPublish = "0.37.0"
skie = "0.10.13"
robolectric = "4.14.1"
junit = "5.11.4"
junitLauncher = "1.11.4"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "androidxStartup" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
detekt-api = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "io.gitlab.arturbosch.detekt:detekt-test", version.ref = "detekt" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitLauncher" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
